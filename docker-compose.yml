x-superset: &superset
  image: self-service-superset:6.1.0
  build: .
  env_file: docker/.env-non-dev
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    # /app/docker/pythonpath_dev is on PYTHONPATH (see docker/.env-non-dev)
    - ./docker:/app/docker:ro
    - superset_home:/app/superset_home

name: self-service
services:
  db:
    image: postgres:14.24
    env_file: docker/.env-non-dev
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data

  superset:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    ports:
      - ${SUPERSET_PUBLISH:-127.0.0.1:8088}:8088
    extra_hosts:
      # Read from the shell or a top-level .env, not docker/.env-non-dev.
      - "identity.kenyahmis.org:${IDENTITY_HOST_IP}"
    healthcheck:
      # The ./docker mount hides the image's own healthcheck script.
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  superset-worker:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    <<: *superset
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    healthcheck:
      disable: true

volumes:
  db_home:
  superset_home:
  redis:
